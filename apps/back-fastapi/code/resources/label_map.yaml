  # Itens diversos e B2B/out of scope → OUTROS
  outros:
    - outros
    - nao_entendi
    - não_entendi
    - smalltalk
    - ruido
    - ruído
    - spam
    - cliente_loja_b2b
    - b2b
    - atacado
    - revenda
    - pos_venda
    - posvenda
    - pos_vendas
    - pos-venda
    - como_comprar        # antigo rótulo → hoje cai em onde_comprar via collapse_to
    - trocar_politica     # variantes soltas
    - politica            # genérico demais

# Rótulos a descartar explicitamente (vazios etc.)
drop: ["", "n/a", "none", "null"]

# ======================
# Colapsos explícitos (apelidos antigos → canônico)
# ======================
collapse_to:
  onde_comprar:
    - como_comprar
  pedido_sugestao:
    - pedir_sugestao_produto
  troca_devolucao:
    - troca_devolucao_politica
  outros:
    - outros_cluster
